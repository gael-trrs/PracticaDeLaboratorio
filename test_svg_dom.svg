<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
    <!-- line -->
    <line x1="20" y1="20" x2="200" y2="20" stroke="red" stroke-width="3" />
    <line x1="20" y1="50" x2="200" y2="50" stroke="blue" stroke-width="5" />

    <!-- circle -->
    <circle cx="80" cy="150" r="40" fill="yellow" stroke="black" stroke-width="2" />
    <circle cx="200" cy="150" r="25" fill="orange" stroke="none" />

    <!-- rect -->
    <rect x="20" y="220" width="120" height="60" fill="lightblue" stroke="navy" stroke-width="2" />
    <rect x="180" y="220" width="80" height="80" fill="pink" stroke="red" stroke-width="4" />

    <!-- ellipse -->
    <ellipse cx="100" cy="380" rx="60" ry="30" fill="lightgreen" stroke="green" stroke-width="2" />
    <ellipse cx="250" cy="380" rx="30" ry="60" fill="magenta" stroke="black" stroke-width="1" />

    <!-- polyline -->
    <polyline points="350,50 400,100 450,50 500,100" fill="none" stroke="purple" stroke-width="3" />
    <polyline points="350,150 380,220 430,140 480,200" fill="lightgray" stroke="black" stroke-width="2" />

    <!-- text -->
    <text x="350" y="280" font-family="Arial" font-size="24" fill="black">Prueba SVG Java 2D</text>
    <text x="350" y="320" font-family="Courier New" font-size="18" fill="blue">Figura 2 de texto</text>
</svg>